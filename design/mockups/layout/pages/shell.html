<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App shell layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=DM+Mono:wght@500&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#00705f}a:hover{color:#121521}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f3f5fa; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #121521">
<div style="position: absolute; left: 8px; right: 8px; top: 8px; height: 128px; box-sizing: border-box; border: 2px dashed #00705f; border-radius: 14px; background: rgba(0, 168, 143, 0.08); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font: 700 12px/16px Figtree, 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #00705f">Page header</span>
<span style="font: 500 13px/18px Figtree, 'Segoe UI', system-ui, sans-serif; color: #121521; white-space: pre-line">Scrolls away with content.
Eyebrow · display title · summary
32px top, 16px sides</span>
</div>
<div style="position: absolute; left: 8px; right: 8px; top: 144px; bottom: 92px; box-sizing: border-box; border: 2px dashed #00705f; border-radius: 14px; background: rgba(0, 168, 143, 0.08); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font: 700 12px/16px Figtree, 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: #00705f">Page content</span>
<span style="font: 500 13px/18px Figtree, 'Segoe UI', system-ui, sans-serif; color: #121521; white-space: pre-line">Scrolls. One column.
16px side gutter. 8px between rows.
Max 560px wide, centered on big screens.
40px clear space after the last row.</span>
</div>
<a href="#" aria-label="Add item" style="position: absolute; right: 16px; bottom: 100px; width: 64px; height: 64px; border-radius: 999px; background: #00a88f; color: #03211c; box-shadow: 0 4px 0 #03211c; display: grid; place-items: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="display: block; flex: none; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round"><path d="M12 5v14M5 12h14"></path></svg></a>
<div style="position: absolute; right: 92px; bottom: 108px; width: 150px; text-align: right; font: 500 13px/18px Figtree, 'Segoe UI', system-ui, sans-serif; color: #121521">Add button. List page only. 16px above the nav.</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0"><nav aria-label="Main" style="flex: none; background: #ffffff; border-top: 1px solid #d9dee9; padding: 6px 8px 22px">
<div style="max-width: none; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; min-height: 56px">
<a href="list.html" aria-current="page" style="display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 48px; border-radius: 14px; text-decoration: none">
<span style="width: 56px; height: 30px; border-radius: 999px; background: #00a88f; color: #03211c; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="display: block; flex: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg></span>
<span style="font: 700 12px/16px Figtree, 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.02em; color: #121521">List</span>
</a>
<a href="#" style="display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 48px; border-radius: 14px; text-decoration: none">
<span style="width: 56px; height: 30px; border-radius: 999px; background: transparent; color: #505870; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="display: block; flex: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"></path></svg></span>
<span style="font: 700 12px/16px Figtree, 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.02em; color: #505870">Shop</span>
</a>
<button type="button" aria-haspopup="dialog" aria-expanded="false"  style="display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 48px; border-radius: 14px; text-decoration: none; padding: 0; border: 0; background: transparent; cursor: pointer">
<span style="width: 56px; height: 30px; border-radius: 999px; background: transparent; color: #505870; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="display: block; flex: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
<span style="font: 700 12px/16px Figtree, 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.02em; color: #505870">More</span>
</button>
</div>
</nav></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: repeating-linear-gradient(45deg, rgba(214, 31, 105, 0.18) 0 6px, transparent 6px 12px)"></div>
</div>
</body>
</html>
